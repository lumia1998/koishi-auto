version: "3"
services:
  koishi:
    image: koishijs/koishi
    container_name: koishi
    restart: always
    ports:
      - "5140:5140"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./koishi:/koishi

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: always
    ports:
      - 43000:3000
      - 43001:3001
      - 6099:6099
    environment:
      # 从 start.sh 脚本传入动态获取的 UID 和 GID
      - NAPCAT_UID=${NAPCAT_UID}
      - NAPCAT_GID=${NAPCAT_GID}
    volumes:
      - ./napcat/.config/QQ:/app/.config/QQ
      - ./napcat/config:/app/napcat/config
      - ./koishi:/koishi
